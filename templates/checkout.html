{% extends "base.html" %}

{% block content %}

<div class="checkout-form">

    <h1>Checkout</h1>

    <p>
        Cash on delivery. Tell us where to send your books.
    </p>


    <form
        action="/checkout"
        method="POST"
        onsubmit="return validatePhone()"
    >

        <label for="name">
            Full Name *
        </label>

        <input
            type="text"
            id="name"
            name="name"
            required
        >


        <label for="phone">
            Phone Number *
        </label>

        <div class="phone-input">

            <span>+91</span>

            <input
                type="text"
                id="phone"
                name="phone"
                placeholder="Enter 10 digit number"
                required
            >

        </div>


        <label for="address">
            Delivery Address *
        </label>

        <textarea
            id="address"
            name="address"
            rows="5"
            required
        ></textarea>


        <div>

            <a href="/cart">
                Back to cart
            </a>

            <button type="submit">
                Place order
            </button>

        </div>

    </form>

</div>

{% endblock %}
