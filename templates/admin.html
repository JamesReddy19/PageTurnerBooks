{% extends "base.html" %}

{% block content %}

<h1>Admin Panel</h1>

<p>Welcome, Admin!</p>

<a href="{{ url_for('admin_logout') }}">
    Logout
</a>

<h2>Add Book</h2>

<form action="{{ url_for('admin_add') }}" method="POST">

    <input type="text" name="title" placeholder="Title" required>

    <input type="text" name="author" placeholder="Author" required>

    <input type="text" name="category" placeholder="Category" required>

    <input type="number" name="price" placeholder="Price" required>

    <input
        type="text"
        name="description"
        placeholder="Description"
        required
    >

    <input type="number" name="stock" placeholder="Stock" required>

    <input type="text" name="color" placeholder="Color" required>

    <input
        type="text"
        name="image"
        placeholder="Image filename"
        required
    >

    <button type="submit" class="add-button">
        Add Book
    </button>

</form>

<h2>Books</h2>

{% for book in books %}

<div>

    <h3>{{ book["title"] }}</h3>

    <form
        action="{{ url_for('admin_edit', id=book['id']) }}"
        method="POST"
    >

        <input
            type="text"
            name="title"
            value="{{ book['title'] }}"
            required
        >

        <input
            type="text"
            name="author"
            value="{{ book['author'] }}"
            required
        >

        <input
            type="number"
            name="price"
            value="{{ book['price'] }}"
            required
        >

        <input
            type="number"
            name="stock"
            value="{{ book['stock'] }}"
            required
        >

        <button type="submit" class="add-button">
            Update
        </button>

    </form>

    <form
        action="{{ url_for('admin_delete', id=book['id']) }}"
        method="POST"
    >

        <button type="submit">
            Delete
        </button>

    </form>

</div>

<hr>

{% endfor %}

{% endblock %}
