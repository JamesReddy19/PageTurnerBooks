{% extends "base.html" %}

{% block content %}

<h1>Admin Login</h1>

    <label>Password</label>

    <input
        type="password"
        name="password"
        required
    >

    <button type="submit" class="add-button">
        Login
    </button>

</form>

{% endblock %}
