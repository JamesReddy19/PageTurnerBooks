{% extends 'base.html' %}
{% block title %}Login · PageTurner Books
{% endblock %}
{% block content %}
<section class="auth-card">
<h1>Welcome back</h1>
<p class="muted">Log in to manage your books and orders.</p>
<form method="post" class="stack-form">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>Email<input type="email" name="email" autocomplete="email" required>
</label>
<label>Password<input type="password" name="password" autocomplete="current-password" required>
</label>
<button>Log in</button>
</form>
<p>
<a href="{{ url_for('auth.password_reset_request') }}">Forgot password?</a>
</p>
<p>New here? <a href="{{ url_for('auth.register') }}">Create an account</a>.</p>
</section>

{% endblock %}
